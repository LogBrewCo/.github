name: Bug report
description: Something in a LogBrew SDK, the CLI, the MCP server, a skill, or the docs does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, tokens, and personal data from everything you paste here. Report security problems privately (see the security policy).
  - type: input
    id: version
    attributes:
      label: Package and version
      description: The package name and version, the output of logbrew --version, or the docs page URL.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and OS
      description: For example Node.js 22 on Ubuntu 24.04, or Python 3.13 on macOS 26.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or commands that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full error message and stack trace.
      render: text
    validations:
      required: true
