name: Feature request
description: Something you want LogBrew to do that it does not do today.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: Describe the task, not the solution. For example "find which release started an error".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround you use now, if any.
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: An API, CLI flag, MCP operation, or docs page you have in mind.
